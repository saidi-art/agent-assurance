name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: "Run ID of a previous build to redeploy (rollback). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/checkout@v4

      - name: Build static site
        if: ${{ inputs.rollback_run_id == '' }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -r site/. dist/
          # Fonts are committed base64-encoded (web UI cannot commit binaries);
          # decode and verify them before the build.
          for f in dist/assets/fonts/*.woff2.b64; do
            [ -e "$f" ] || continue
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          cd dist/assets/fonts
          echo "7ced53420784c93cecccb7c27237594f0e41e5a7990581565f0aef8eda9e9d2f  ibm-plex-mono-400.woff2" | sha256sum -c -
          echo "6e618344335cc436ffd25deba4f4cb5a60ca6c3a4832e67f236ca43922f74eea  ibm-plex-mono-500.woff2" | sha256sum -c -
          echo "3100e775e8616cd2611beecfa23a4263d7037586789b43f035236a2e6fbd4c62  inter-var.woff2" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          cp data/attestations.json dist/data-attestations.source.json
          mkdir -p dist/data
          mv dist/data-attestations.source.json dist/data/attestations.json

      - name: Render ledger from attestations.json
        if: ${{ inputs.rollback_run_id == '' }}
        run: node scripts/build.mjs dist data/attestations.json

      - name: Upload build artifact (rollback source)
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 90

      - name: Rollback - restore previous build artifact
        if: ${{ inputs.rollback_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
