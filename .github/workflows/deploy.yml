name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: "Run ID of a previous build to redeploy (rollback). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/checkout@v4

      - name: Build static site
        if: ${{ inputs.rollback_run_id == '' }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/data
          cp -r site/. dist/
          cp data/attestations.json dist/data/attestations.json

      - name: Upload build artifact (rollback source)
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 90

      - name: Rollback - restore previous build artifact
        if: ${{ inputs.rollback_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
